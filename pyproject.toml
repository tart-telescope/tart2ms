[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tart2ms"
version = '0.9.7'
description = "Convert TART observation data to Measurement Sets"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "tart >= 1.4.0",
    "tart_tools >= 1.4.0",
    "astropy (>=7.1.0,<9.0.0)",
    # dask-ms-2 is tmolteno's maintained fork of dask-ms 0.2.x
    # (github.com/tmolteno/dask-ms), published under its own name because
    # PyPI rejects direct-URL dependencies. Same `daskms` import; 0.2.33
    # widens requires-python to <3.15 so tart2ms installs on Python 3.14
    # (ratt-ru/dask-ms 0.2.x caps at <3.14 and its older releases cannot
    # build there). See issue #66.
    # 0.2.34 makes casacure the table backend unconditionally: it aliases
    # `casacore` -> `casacure` on import, so a casacore-free install (this
    # package no longer depends on python-casacore) can write MSs. Before
    # 0.2.34 that alias needed DASK_MS_BACKEND=casacure, without which
    # dask-ms lazy-imported the missing python-casacore at MS-write time.
    "dask-ms-2 (>=0.2.34,<0.3.0)",
    "h5py (>=3.1.0,<4.0.0)",
    "numpy (>=1.6.0,<3.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "progress (>=1.6.1,<2.0.0)",
    # casacure is the pure-Rust casacore replacement (tmolteno/casacure);
    # it replaces python-casacore (casacore.tables / casacore.quanta imports)
    # and the pyrap bindings the old UVW generator used. dask-ms-2 pulls it
    # in as its table backend; declared directly because tart2ms imports it.
    # >= 3.8.40: casacure <= 3.8.39 wrote string-array keywords (QuantumUnits)
    # as {shape, array} sub-records and CASA refused the MS this tool writes
    # (casacure#40, skarabina#14).
    "casacure (>=3.8.40)",
    # fixvis._itrf_uvw_frame uses erfa directly for the ITRS->ICRS rotation
    # (astropy already depends on pyerfa, declared here as it is imported).
    "pyerfa (>=2.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "codex-africanus (>=0.4.2,<0.5)",
    # 0.6.5 fixes celestial_positions(): it returned *barycentric* ICRS
    # directions that collapsed every satellite onto the Earth's own
    # direction (tart-telescope/catalogue#14, tart2ms#68). It now returns
    # geocentric GCRS directions, or topocentric RA/Dec with lat/lon.
    # tart2ms keeps using horizontal_positions() (topocentric az/el) for the
    # GNSS model path -- azel2radec to J2000 is the verified-correct route
    # into the SOURCE table -- but the floor guarantees the fixed client for
    # anything that does call celestial_positions().
    "tart-catalogue-client (>=0.6.5,<0.7)"
]

# [project.optional-dependencies]
# predict = [
#     "codex-africanus (>=0.4.2,<0.5)"
# ]

[project.scripts]
tart2ms = "tart2ms.scripts.tart2ms:main"

[project.urls]
Homepage = "http://github.com/tart-telescope/tart2ms"

[tool.hatch.version]
path = "tart2ms/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/tart2ms",
]

[dependency-groups]
# The release tooling: tasks.py (`invoke version|test|release`), which runs the
# pre-release suite, bumps the version, stamps CHANGES.md and monitors the
# PyPI publish workflow.
dev = [
    "invoke>=3.0,<4",
    "plumbum>=2.0,<3",
]
