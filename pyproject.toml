[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tart2ms"
version = '0.9.3'
description = "Convert TART observation data to Measurement Sets"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "tart >= 1.4.0",
    "tart_tools >= 1.4.0",
    "astropy (>=7.1.0,<9.0.0)",
    "dask-ms[casacure] (>=0.2.32,<0.3.0)",
    "casacure (>=3.8.13,<4.0.0)",
    "h5py (>=3.1.0,<4.0.0)",
    "numpy (>=1.6.0,<3.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "progress (>=1.6.1,<2.0.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "codex-africanus (>=0.4.2,<0.5)",
    "tart-catalogue-client (>=0.5.1,<0.6)"
]

# [project.optional-dependencies]
# predict = [
#     "codex-africanus (>=0.4.2,<0.5)"
# ]

[project.scripts]
tart2ms = "tart2ms.scripts.tart2ms:main"

[project.urls]
Homepage = "http://github.com/tart-telescope/tart2ms"

[tool.uv.sources]
# Fork of dask-ms with the casacure (pure Rust casacore tables) backend
dask-ms = { git = "https://github.com/tmolteno/dask-ms", branch = "master" }

[tool.hatch.build.targets.sdist]
include = [
    "/tart2ms",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "flake8>=7.1.2",
    # Release automation (tasks.py): invoke is the task runner, plumbum the
    # shell-command plumbing it uses for the version bump, the tag push and
    # the CI publish wait. pytest/flake8 belong here too: without them
    # `uv run pytest` silently falls back to whatever is on PATH (a global
    # pytest, which cannot import the project).
    "invoke>=3.0",
    "plumbum>=2.0",
]
